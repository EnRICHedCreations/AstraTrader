<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstraTrader Agent Console</title><style>body{margin:0;background:#0b1014;color:#e1e9ee;font:15px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:28px}section{background:#11191f;border:1px solid #293740;border-radius:8px;padding:18px;margin:14px 0}input,button,textarea{font:inherit;background:#172129;color:#e1e9ee;border:1px solid #42515c;border-radius:5px;padding:10px}input,textarea{width:100%}button{cursor:pointer}.bar{display:flex;gap:8px;flex-wrap:wrap}.good{color:#a4eead}.bad{color:#ff9e98}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}code{color:#a4eead}</style><main><h1>AstraTrader Agent Console</h1><p>Machine-readable control surface for GPT Astra. Uses the same operator bearer token as the operations dashboard.</p><section><label>Operator token<input id="token" type="password" minlength="32" autocomplete="off"></label><div class="bar" style="margin-top:10px"><button id="connect">Connect</button><button id="refresh">Refresh</button></div><p id="msg"></p></section><section><h2>Agent readiness</h2><pre id="status">Not connected.</pre></section><section><h2>Opportunities</h2><pre id="opp">[]</pre></section><section><h2>Actions</h2><div class="bar"><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="kill">Kill</button></div><p>Execute an accepted signal by ID:</p><input id="signal" placeholder="signal:..."><button id="execute">Execute accepted signal</button><p>Close an existing paper position by mint:</p><input id="mint" placeholder="Solana mint"><button id="close">Close paper position</button></section><section><h2>API contract</h2><pre id="caps"></pre></section></main><script>let secret='';const e=id=>document.getElementById(id);async function api(path,method='GET',payload){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+secret,'Content-Type':'application/json'},...(payload?{body:JSON.stringify(payload)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){if(!secret)return;try{const [s,o,c]=await Promise.all([api('/api/agent/status'),api('/api/agent/opportunities'),api('/api/agent/capabilities')]);e('status').textContent=JSON.stringify(s,null,2);e('opp').textContent=JSON.stringify(o,null,2);e('caps').textContent=JSON.stringify(c,null,2);e('msg').textContent='Connected';e('msg').className='good'}catch(x){e('msg').textContent=x.message;e('msg').className='bad'}}e('connect').onclick=()=>{secret=e('token').value;e('token').value='';load()};e('refresh').onclick=load;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{await api('/api/agent/action','POST',{action:b.dataset.action});await load()}catch(x){e('msg').textContent=x.message}});e('execute').onclick=async()=>{try{await api('/api/agent/action','POST',{action:'execute_signal',signalId:e('signal').value.trim()});await load()}catch(x){e('msg').textContent=x.message}};e('close').onclick=async()=>{try{await api('/api/agent/action','POST',{action:'close_position',mint:e('mint').value.trim()});await load()}catch(x){e('msg').textContent=x.message}};</script></html>
