name: Verify AstraTrader
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/trader/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node --experimental-strip-types --test tests/quant.test.mjs tests/backend.test.mjs
